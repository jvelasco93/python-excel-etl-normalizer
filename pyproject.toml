[project]
name = "python-excel-etl-normalizer"
version = "0.1.0"
description = "Excel ETL tool built with Python, Pandas and PyQt6 for data cleaning and normalization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyqt6>=6.7.0",
    "python-calamine>=0.2.0",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]
